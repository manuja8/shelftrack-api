name: ShelfTrack CI Risk Check

on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOYPILOT_API_URL: https://deploypilot-ai-api-korea-2026.azurewebsites.net
  APP_ENV: test
  INVENTORY_REGION: ap-south

jobs:
  shelftrack-ci:
    name: ShelfTrack Build, Test and Risk Analysis
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # =========================================================
      # 2. PYTHON
      # =========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 3. PREPARE LOG DIRECTORY
      # =========================================================
      - name: Prepare CI logs
        shell: bash
        run: |
          mkdir -p ci-logs

      # =========================================================
      # 4. REAL GIT METRICS
      # =========================================================
      - name: Collect Git metrics
        id: git_metrics
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then

            FILES_CHANGED=$(git diff --name-only HEAD^ HEAD | sed '/^$/d' | wc -l | xargs)

            COMMIT_SIZE=$(git diff --numstat HEAD^ HEAD | awk '
            {
              if ($1 ~ /^[0-9]+$/) added += $1
              if ($2 ~ /^[0-9]+$/) deleted += $2
            }
            END {
              print added + deleted + 0
            }')

          else

            FILES_CHANGED=$(git ls-files | wc -l | xargs)

            COMMIT_SIZE=0

          fi

          echo "files_changed=$FILES_CHANGED" >> "$GITHUB_OUTPUT"
          echo "commit_size=$COMMIT_SIZE" >> "$GITHUB_OUTPUT"

          echo "Files changed: $FILES_CHANGED"
          echo "Commit size: $COMMIT_SIZE"

      # =========================================================
      # 5. REAL DEPENDENCY INSTALLATION
      #
      # A genuine pip dependency conflict is captured here.
      #
      # We temporarily prevent GitHub from stopping immediately
      # because the error log must still be sent to DeployPilot.
      # =========================================================
      - name: Install dependencies
        id: dependencies
        shell: bash
        run: |
          START_TIME=$(date +%s)

          set +e

          python -m pip install --upgrade pip > ci-logs/pip-upgrade.log 2>&1

          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt \
            > ci-logs/dependency.log 2>&1

          EXIT_CODE=$?

          set -e

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "Dependency installation PASSED."
          else
            echo "Dependency installation FAILED."
            echo ""
            echo "----- REAL PIP ERROR -----"
            tail -n 120 ci-logs/dependency.log
          fi

          exit 0

      # =========================================================
      # 6. REAL CONFIGURATION CHECK
      # =========================================================
      - name: Validate configuration
        id: configuration
        shell: bash
        run: |
          if [ "${{ steps.dependencies.outputs.exit_code }}" != "0" ]; then

            echo "Configuration check skipped because dependency installation failed." \
              > ci-logs/configuration.log

            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "duration=0" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          START_TIME=$(date +%s)

          set +e

          python scripts/check_config.py \
            > ci-logs/configuration.log 2>&1

          EXIT_CODE=$?

          set -e

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "Configuration validation PASSED."
            cat ci-logs/configuration.log
          else
            echo "Configuration validation FAILED."
            cat ci-logs/configuration.log
          fi

          exit 0

      # =========================================================
      # 7. REAL TEST EXECUTION
      # =========================================================
      - name: Run automated tests
        id: tests
        shell: bash
        run: |
          if [ "${{ steps.dependencies.outputs.exit_code }}" != "0" ]; then

            echo "Tests skipped because dependency installation failed." \
              > ci-logs/tests.log

            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "tests_failed=0" >> "$GITHUB_OUTPUT"
            echo "duration=0" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          if [ "${{ steps.configuration.outputs.exit_code }}" != "0" ]; then

            echo "Tests skipped because configuration validation failed." \
              > ci-logs/tests.log

            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "tests_failed=0" >> "$GITHUB_OUTPUT"
            echo "duration=0" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          START_TIME=$(date +%s)

          set +e

          python -m pytest -q \
            > ci-logs/tests.log 2>&1

          EXIT_CODE=$?

          set -e

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          TESTS_FAILED=0

          if [ "$EXIT_CODE" -ne 0 ]; then

            TESTS_FAILED=$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("ci-logs/tests.log").read_text(errors="ignore")

          matches = re.findall(
              r"(\d+)\s+failed",
              text,
              flags=re.IGNORECASE,
          )

          if matches:
              print(matches[-1])
          else:
              print("1")
          PY
            )

          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "tests_failed=$TESTS_FAILED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then

            echo "Automated tests PASSED."
            cat ci-logs/tests.log

          else

            echo "Automated tests FAILED."
            echo ""
            echo "----- REAL PYTEST ERROR -----"
            tail -n 150 ci-logs/tests.log

          fi

          exit 0

      # =========================================================
      # 8. RUNNER RESOURCE METRICS
      # =========================================================
      - name: Collect runner metrics
        id: runner_metrics
        shell: bash
        run: |
          CPU_USAGE=$(python - <<'PY'
          import os

          try:
              load = os.getloadavg()[0]
              cpu_count = os.cpu_count() or 1
              percentage = min(100.0, (load / cpu_count) * 100.0)
              print(round(percentage, 2))
          except Exception:
              print(0.0)
          PY
          )

          MEMORY_USAGE=$(python - <<'PY'
          try:
              values = {}

              with open("/proc/meminfo", "r") as file:
                  for line in file:
                      key, value = line.split(":", 1)
                      values[key] = int(value.strip().split()[0])

              total = values["MemTotal"]
              available = values["MemAvailable"]

              used_mb = (total - available) / 1024

              print(round(used_mb, 2))

          except Exception:
              print(0.0)
          PY
          )

          echo "cpu_usage=$CPU_USAGE" >> "$GITHUB_OUTPUT"
          echo "memory_usage=$MEMORY_USAGE" >> "$GITHUB_OUTPUT"

          echo "CPU Usage: $CPU_USAGE%"
          echo "Memory Usage: $MEMORY_USAGE MB"

      # =========================================================
      # 9. DETERMINE THE REAL CI RESULT
      # =========================================================
      - name: Determine real CI result
        id: real_result
        shell: bash
        run: |
          DEPENDENCY_EXIT="${{ steps.dependencies.outputs.exit_code }}"
          CONFIG_EXIT="${{ steps.configuration.outputs.exit_code }}"
          TEST_EXIT="${{ steps.tests.outputs.exit_code }}"

          ACTUAL_RESULT="PASS"
          FAILED_STAGE="none"
          ERROR_LOG_FILE=""

          if [ "$DEPENDENCY_EXIT" != "0" ]; then

            ACTUAL_RESULT="FAIL"
            FAILED_STAGE="dependency"
            ERROR_LOG_FILE="ci-logs/dependency.log"

          elif [ "$CONFIG_EXIT" != "0" ]; then

            ACTUAL_RESULT="FAIL"
            FAILED_STAGE="configuration"
            ERROR_LOG_FILE="ci-logs/configuration.log"

          elif [ "$TEST_EXIT" != "0" ]; then

            ACTUAL_RESULT="FAIL"
            FAILED_STAGE="test"
            ERROR_LOG_FILE="ci-logs/tests.log"

          fi

          echo "actual_result=$ACTUAL_RESULT" >> "$GITHUB_OUTPUT"
          echo "failed_stage=$FAILED_STAGE" >> "$GITHUB_OUTPUT"
          echo "error_log_file=$ERROR_LOG_FILE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "======================================"
          echo "REAL SHELFTRACK CI RESULT"
          echo "======================================"
          echo "Actual result : $ACTUAL_RESULT"
          echo "Failed stage  : $FAILED_STAGE"
          echo "======================================"

      # =========================================================
      # 10. CHECK HOSTED DEPLOYPILOT BACKEND
      # =========================================================
      - name: Verify DeployPilot backend
        shell: bash
        run: |
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output deploypilot-model-status.json \
            --write-out "%{http_code}" \
            "$DEPLOYPILOT_API_URL/model-status")

          echo "DeployPilot model status HTTP: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then

            echo "::error::Unable to access the hosted DeployPilot backend."

            cat deploypilot-model-status.json || true

            exit 1

          fi

          cat deploypilot-model-status.json

      # =========================================================
      # 11. CREATE DEPLOYPILOT REQUEST
      # =========================================================
      - name: Build DeployPilot prediction request
        shell: bash
        env:

          PIPELINE_ID: ${{ github.workflow }}

          # run_id alone does NOT change during GitHub re-runs.
          # run_attempt makes every execution unique.
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}

          COMMIT_SIZE: ${{ steps.git_metrics.outputs.commit_size }}
          FILES_CHANGED: ${{ steps.git_metrics.outputs.files_changed }}

          DEPENDENCY_DURATION: ${{ steps.dependencies.outputs.duration }}
          CONFIG_DURATION: ${{ steps.configuration.outputs.duration }}

          TEST_DURATION: ${{ steps.tests.outputs.duration }}
          TESTS_FAILED: ${{ steps.tests.outputs.tests_failed }}

          CPU_USAGE: ${{ steps.runner_metrics.outputs.cpu_usage }}
          MEMORY_USAGE: ${{ steps.runner_metrics.outputs.memory_usage }}

          ACTUAL_RESULT: ${{ steps.real_result.outputs.actual_result }}
          FAILED_STAGE: ${{ steps.real_result.outputs.failed_stage }}
          ERROR_LOG_FILE: ${{ steps.real_result.outputs.error_log_file }}

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path


          def integer(name, default=0):
              try:
                  return int(os.getenv(name, default))
              except Exception:
                  return default


          def number(name, default=0.0):
              try:
                  return float(os.getenv(name, default))
              except Exception:
                  return default


          error_log = ""

          error_file = os.getenv(
              "ERROR_LOG_FILE",
              "",
          ).strip()


          if error_file:

              path = Path(error_file)

              if path.exists():

                  error_log = path.read_text(
                      errors="ignore"
                  )

                  # Prevent an unnecessarily huge API request.
                  error_log = error_log[-12000:]


          payload = {

              "pipeline_id": os.environ["PIPELINE_ID"],

              "run_id": os.environ["RUN_ID"],

              "ci_tool": "GitHub Actions",

              "repository": os.environ["REPOSITORY"],

              "branch": os.environ["BRANCH"],

              "commit_size": integer(
                  "COMMIT_SIZE"
              ),

              "files_changed": integer(
                  "FILES_CHANGED"
              ),

              "warnings": 0,

              "tests_failed": integer(
                  "TESTS_FAILED"
              ),

              "build_duration_sec": (
                  number("DEPENDENCY_DURATION")
                  + number("CONFIG_DURATION")
              ),

              "test_duration_sec": number(
                  "TEST_DURATION"
              ),

              "deploy_duration_sec": 0,

              "cpu_usage_pct": number(
                  "CPU_USAGE"
              ),

              "memory_usage_mb": number(
                  "MEMORY_USAGE"
              ),

              "retry_count": 0,

              # The backend calculates the real historical
              # previous_failure_rate for this repository.
              "previous_failure_rate": 0,

              "language": "Python",

              "os": "ubuntu-latest",

              "cloud_provider": "GitHub Hosted",

              "error_log": error_log,

              "quality_gate_enabled": True,

              "actual_result": os.environ[
                  "ACTUAL_RESULT"
              ],
          }


          with open(
              "deploypilot-request.json",
              "w",
          ) as file:

              json.dump(
                  payload,
                  file,
                  indent=2,
              )


          print(
              "DeployPilot request created."
          )

          print(
              f"Run ID: {os.environ['RUN_ID']}"
          )

          print(
              f"Actual CI Result: {os.environ['ACTUAL_RESULT']}"
          )

          print(
              f"Failed Stage: {os.environ['FAILED_STAGE']}"
          )

          print(
              f"Error Log Length: {len(error_log)}"
          )
          PY

      # =========================================================
      # 12. CALL THE REAL HOSTED DEPLOYPILOT API
      # =========================================================
      - name: Send CI result to DeployPilot
        shell: bash
        env:
          DEPLOYPILOT_API_KEY: ${{ secrets.DEPLOYPILOT_API_KEY }}

        run: |
          if [ -z "$DEPLOYPILOT_API_KEY" ]; then

            echo "::error::DEPLOYPILOT_API_KEY GitHub secret is missing."

            exit 1

          fi

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output deploypilot-response.json \
            --write-out "%{http_code}" \
            --request POST \
            "$DEPLOYPILOT_API_URL/github/predict" \
            --header "Content-Type: application/json" \
            --header "X-API-Key: $DEPLOYPILOT_API_KEY" \
            --data @deploypilot-request.json)

          echo "DeployPilot API HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then

            echo "::error::DeployPilot prediction API request failed."

            cat deploypilot-response.json || true

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "DEPLOYPILOT RESPONSE"
          echo "======================================"

          python -m json.tool deploypilot-response.json

      # =========================================================
      # 13. GITHUB SUMMARY
      # =========================================================
      - name: Publish CI and ML result summary
        shell: bash
        env:

          ACTUAL_RESULT: ${{ steps.real_result.outputs.actual_result }}

          FAILED_STAGE: ${{ steps.real_result.outputs.failed_stage }}

        run: |
          python - <<'PY'
          import json
          import os


          with open(
              "deploypilot-response.json",
              "r",
          ) as file:

              result = json.load(file)


          actual_result = os.getenv(
              "ACTUAL_RESULT",
              "UNKNOWN",
          )


          failed_stage = os.getenv(
              "FAILED_STAGE",
              "unknown",
          )


          failure_type = result.get(
              "failure_type"
          )


          if actual_result == "PASS":

              failure_type = (
                  "N/A - no CI failure"
              )


          previous_rate = result.get(
              "previous_failure_rate_used"
          )


          if isinstance(
              previous_rate,
              (int, float),
          ):

              previous_rate_display = (
                  f"{previous_rate * 100:.1f}%"
              )

          else:

              previous_rate_display = (
                  previous_rate
              )


          values = {

              "Actual CI Result":
                  actual_result,

              "Real Failed Stage":
                  failed_stage,

              "ML Prediction":
                  result.get("prediction"),

              "Risk Score":
                  result.get("risk_score"),

              "Risk Level":
                  result.get("risk_level"),

              "Failure Type":
                  failure_type,

              "Quality Gate":
                  result.get(
                      "quality_gate_action"
                  ),

              "Gate Mode":
                  result.get(
                      "gate_mode"
                  ),

              "Cold Start":
                  result.get(
                      "cold_start"
                  ),

              "Meaningful History Runs":
                  result.get(
                      "meaningful_history_runs"
                  ),

              "Previous Failure Rate Used":
                  previous_rate_display,
          }


          summary_file = os.environ[
              "GITHUB_STEP_SUMMARY"
          ]


          with open(
              summary_file,
              "a",
              encoding="utf-8",
          ) as summary:

              summary.write(
                  "# ShelfTrack CI Result\n\n"
              )

              summary.write(
                  "| Result | Value |\n"
              )

              summary.write(
                  "|---|---|\n"
              )


              for key, value in values.items():

                  summary.write(
                      f"| {key} | {value} |\n"
                  )


              summary.write(
                  "\n## Interpretation\n\n"
              )


              if actual_result == "FAIL":

                  summary.write(
                      "The ShelfTrack CI pipeline genuinely failed. "
                      f"The real failed stage was **{failed_stage}**.\n"
                  )

              else:

                  summary.write(
                      "All real ShelfTrack CI checks passed. "
                      "The DeployPilot prediction shown above is an independent ML risk prediction.\n"
                  )

          PY

      # =========================================================
      # 14. FINAL REAL CI DECISION
      #
      # IMPORTANT:
      #
      # GitHub status is based on the REAL pipeline.
      #
      # ML prediction is still displayed and recorded,
      # but does not artificially turn a successful application
      # build into a failed build.
      # =========================================================
      - name: Final ShelfTrack CI decision
        shell: bash
        env:

          ACTUAL_RESULT: ${{ steps.real_result.outputs.actual_result }}

          FAILED_STAGE: ${{ steps.real_result.outputs.failed_stage }}

        run: |
          ACTION=$(python - <<'PY'
          import json

          with open(
              "deploypilot-response.json",
              "r",
          ) as file:

              result = json.load(file)

          print(
              result.get(
                  "quality_gate_action",
                  "UNKNOWN",
              )
          )
          PY
          )

          PREDICTION=$(python - <<'PY'
          import json

          with open(
              "deploypilot-response.json",
              "r",
          ) as file:

              result = json.load(file)

          print(
              result.get(
                  "prediction",
                  "UNKNOWN",
              )
          )
          PY
          )

          RISK=$(python - <<'PY'
          import json

          with open(
              "deploypilot-response.json",
              "r",
          ) as file:

              result = json.load(file)

          print(
              result.get(
                  "risk_score",
                  "UNKNOWN",
              )
          )
          PY
          )

          echo ""
          echo "======================================"
          echo "FINAL RESULT"
          echo "======================================"
          echo "Real CI Result          : $ACTUAL_RESULT"
          echo "Real Failed Stage       : $FAILED_STAGE"
          echo "ML Prediction           : $PREDICTION"
          echo "ML Risk Score           : $RISK"
          echo "ML Quality Gate         : $ACTION"
          echo "======================================"

          # -----------------------------------------------------
          # A REAL application CI failure = RED
          # -----------------------------------------------------
          if [ "$ACTUAL_RESULT" = "FAIL" ]; then

            echo ""
            echo "::error::ShelfTrack genuinely failed during the $FAILED_STAGE stage."

            exit 1

          fi

          # -----------------------------------------------------
          # Application passed.
          #
          # Keep DeployPilot prediction visible, but it does not
          # create a fake application failure.
          # -----------------------------------------------------
          if [ "$ACTION" = "BLOCK" ]; then

            echo ""
            echo "::warning::ShelfTrack CI passed, but DeployPilot predicted HIGH risk and returned BLOCK."

            echo "::warning::This is an ML risk prediction, not a real CI failure."

          elif [ "$ACTION" = "WARN" ]; then

            echo ""
            echo "::warning::ShelfTrack CI passed and DeployPilot returned WARN."

          else

            echo ""
            echo "ShelfTrack CI passed and DeployPilot returned ALLOW."

          fi

          echo ""
          echo "REAL CI RESULT: PASS"

          exit 0